; Firmware do ZENI: ESP32 + MPU-6050/6500, dados de movimento por Bluetooth Low Energy (BLE).
; Gravar:  pio run -e s3 -t upload       (placa ESP32-S3, MPU em SDA=IO1, SCL=IO2)
;          pio run -e c3 -t upload       (placa ESP32-C3, MPU em SDA=IO4, SCL=IO5)
; Ver o log: pio device monitor
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^2.1.0
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

[env:s3]
board = esp32-s3-devkitc-1
; BAT_ADC_PIN=3: divisor 100k/100k do + da bateria até o IO3 (sem os resistores, o ZENI percebe e manda "sem medida")
build_flags = ${env.build_flags} -DSDA_PIN=1 -DSCL_PIN=2 -DBAT_ADC_PIN=3
; Opcionais (descomente e ajuste):
;  -DMPU_INT_PIN=14     fio do INT do MPU até este pino: chacoalhar o ZENI o acorda do sono
;  -DLED_PIN=21         LED que pisca quando o app pede "onde está o ZENI?"

[env:c3]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DSDA_PIN=4 -DSCL_PIN=5
